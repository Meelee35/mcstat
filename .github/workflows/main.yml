name: Build

on:
  push:
    tags:
      - '*'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'
      - run: pip install uv
      - run: uv sync
      - run: uv run pyinstaller --onefile run.py --name mcstat
      - uses: actions/upload-artifact@v4
        with:
          name: mcstat
          path: dist/mcstat
